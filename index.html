<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgriSpray AI</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#06150d;--card:rgba(255,255,255,.06);--line:rgba(52,211,153,.35);--tx:#e8f5ee;--mut:#8fb5a2}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#0f3a24,var(--bg) 60%);color:var(--tx);font-family:'Hind Siliguri',sans-serif;min-height:100vh}
main{max-width:720px;margin:0 auto;padding:20px 16px 40px}
.glass{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;backdrop-filter:blur(12px);box-shadow:0 0 18px rgba(52,211,153,.12)}
.hero{width:100%;padding:22px;font:700 22px 'Hind Siliguri',sans-serif;border:0;border-radius:18px;color:#04140b;background:linear-gradient(135deg,#6ee7b7,#10b981);cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.tile{min-height:88px;font:600 16px 'Hind Siliguri',sans-serif;cursor:pointer;color:var(--tx);text-align:left}
button:focus-visible{outline:3px solid #fff}
.warn{border-color:#f59e0b;color:#fcd34d;margin-bottom:12px}.mut{color:var(--mut);font-size:14px}
@media(min-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<main>
<h1>🌿 AgriSpray AI</h1>
<div id="warn"></div>
<input id="file" type="file" accept="image/*" capture="environment" hidden>
<button class="hero" id="scan">আগাছার ছবি তুলুন</button>
<p class="glass" id="msg" hidden></p>
<div class="grid">
<button class="glass tile">ওষুধের পরামর্শ</button>
<button class="glass tile">ফসল সুরক্ষা যাচাই</button>
<button class="glass tile">উপকার ও অপকার বিশ্লেষণ</button>
<button class="glass tile">আগের স্ক্যানের ইতিহাস</button>
<button class="glass tile">আগাছার জ্ঞানভাণ্ডার</button>
</div>
<p class="mut">সনাক্তকরণ ১০০% নিশ্চিত নয়। ওষুধ ব্যবহারের আগে লেবেল পড়ুন ও স্থানীয় কৃষি কর্মকর্তার পরামর্শ নিন।</p>
</main>
<script>
// ব্যাকএন্ড সার্ভারের ঠিকানা এখানে বদলান (ডিপ্লয়ের পর)
const API = "http://localhost:8000";
const warn = document.getElementById("warn"), msg = document.getElementById("msg"), file = document.getElementById("file"), scan = document.getElementById("scan");
function note(t){ const d=document.createElement("div"); d.className="glass warn"; d.textContent=t; warn.appendChild(d); }
fetch(API+"/health").then(r=>r.json()).then(h=>{ if(!h.ai_identification) note("AI সনাক্তকরণ এখনো সেটআপ করা হয়নি।"); })
  .catch(()=>note("ব্যাকএন্ড চালু নেই (setup required)।"));
scan.onclick = () => file.click();
file.onchange = async () => {
  const f = file.files[0]; if(!f) return;
  scan.disabled = true; scan.textContent = "আপলোড হচ্ছে…"; msg.hidden = true;
  const fd = new FormData(); fd.append("file", f);
  try {
    const r = await fetch(API+"/scans", {method:"POST", body:fd}), d = await r.json();
    msg.textContent = r.ok ? ((d.result && d.result.message) || "স্ক্যান সংরক্ষিত হয়েছে") : (d.detail || "ত্রুটি হয়েছে");
  } catch(e){ msg.textContent = "সার্ভারের সাথে সংযোগ নেই। ইন্টারনেট দেখে আবার চেষ্টা করুন."; }
  msg.hidden = false; scan.disabled = false; scan.textContent = "আগাছার ছবি তুলুন";
};
</script>
</body>
</html>
